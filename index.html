<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Camp Attendance · AC-24 Patel Nagar</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#ffffff; --ink:#1a2233; --muted:#667085; --line:#e2e6ee;
    --brand:#1d4b86; --brand-2:#163a69;
    --ok:#12704a; --ok-bg:#e5f4ec; --bad:#b42318; --bad-bg:#fde9e7; --warn-bg:#fff4e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;padding:20px 16px 22px}
  header .wrap{max-width:860px;margin:0 auto}
  header small{opacity:.8;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
  header h1{margin:4px 0 2px;font-size:22px;line-height:1.25}
  header p{margin:0;opacity:.85;font-size:14px}
  main{max-width:860px;margin:0 auto;padding:16px 16px 120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .fields{display:grid;grid-template-columns:1fr 180px;gap:12px}
  @media (max-width:560px){.fields{grid-template-columns:1fr}}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  select,input[type=date]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  select:focus,input:focus{outline:2px solid #9bb8e0;outline-offset:1px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .toolbar .count{font-size:14px;color:var(--muted)}
  .btn-sm{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .btn-sm:hover{background:#f6f8fb}
  .loc{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.03em}
  .loc span{display:block;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px;margin-top:2px}
  .row{display:grid;grid-template-columns:64px 1fr auto auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;transition:border-color .15s,background .15s}
  .row.missing{border-color:var(--bad);background:var(--bad-bg)}
  .row.is-present{border-color:#b8dfc9}
  .row.is-absent{border-color:#f3c0ba}
  @media (max-width:640px){.row{grid-template-columns:56px 1fr;}.row .seg,.row .photo{grid-column:1 / -1}}
  .ps{font-weight:800;font-size:15px;text-align:center;background:#eef3fa;color:var(--brand);border-radius:10px;padding:10px 4px}
  .ps small{display:block;font-size:10px;font-weight:600;opacity:.7;letter-spacing:.05em}
  .blo{font-size:14px;font-weight:600;line-height:1.3}
  .blo small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg label{flex:1;cursor:pointer;position:relative}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);user-select:none;white-space:nowrap}
  .seg label+label span{border-left:1px solid var(--line)}
  .seg input:checked+span.p{background:var(--ok);color:#fff}
  .seg input:checked+span.a{background:var(--bad);color:#fff}
  .seg input:focus-visible+span{outline:2px solid #9bb8e0;outline-offset:-2px}
  .photo{display:flex;align-items:center;gap:8px}
  .photo input{display:none}
  .photo .pick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 12px;border:1px dashed #9aa6b8;border-radius:10px;cursor:pointer;color:var(--ink);background:#fafbfd;white-space:nowrap}
  .photo .pick.has{border-style:solid;border-color:#b8dfc9;background:var(--ok-bg);color:var(--ok)}
  .photo img{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .photo .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
  .empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .wrap{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center}
  .bar .sum{flex:1;font-size:13px;color:var(--muted)}
  .bar .sum b{color:var(--ink)}
  #submitBtn{font:inherit;font-weight:700;font-size:16px;padding:13px 28px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer}
  #submitBtn:disabled{opacity:.55;cursor:not-allowed}
  .msg{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #b8dfc9}
  .msg.err{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c0ba}
  .msg.info{background:var(--warn-bg);color:#8a4b00;border:1px solid #f5d7a1}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <small>Office of the ERO · AC-24 Patel Nagar</small>
    <h1>Special Camp – BLO Attendance</h1>
    <p>Select your name, mark each polling station, attach a photo and submit.</p>
  </div>
</header>

<main>
  <div id="msg" class="msg"></div>

  <div class="card">
    <div class="fields">
      <div>
        <label class="f" for="supervisor">BLO Supervisor</label>
        <select id="supervisor">
          <option value="">— Select your name —</option>
        </select>
      </div>
      <div>
        <label class="f" for="campDate">Camp date</label>
        <input type="date" id="campDate">
      </div>
    </div>
  </div>

  <div id="list" class="card" style="display:none">
    <div class="toolbar">
      <div class="count" id="count"></div>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn-sm" id="allPresent">Mark all Present</button>
        <button type="button" class="btn-sm" id="clearAll">Clear</button>
      </div>
    </div>
    <div id="rows"></div>
  </div>
  <div id="placeholder" class="empty">Choose a supervisor above to load polling stations.</div>
</main>

<div class="bar">
  <div class="wrap">
    <div class="sum" id="summary">No supervisor selected</div>
    <button id="submitBtn" disabled>Submit</button>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
// Paste your Google Apps Script Web App URL here (ends with /exec)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx645x7aUrZZmN7VzZVk2IdGFskwZKYk6ThwtCZVKp1LuGE155ycCaH6lCklghCbmwpGw/exec";
const PHOTO_REQUIRED = false;   // set true to make a photo mandatory for every PS
const MAX_DIM = 1280;           // photos are resized to this max side before upload
const JPEG_QUALITY = 0.7;

/* ============ DATA (Order No. 1098 dt 25.09.2026, Annexure-A & C) ============ */
const r = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);

const LOCATIONS = [
  {sup:["NANAK CHAND"], loc:"M.C. Primary School, Prem Nagar", ps:[...r(1,7), ...r(9,17)]},
  {sup:["DEVENDER KUMAR MAURYA"], loc:"Govt. Girls/Govt. Boys Sr. Sec. School, Prem Nagar", ps:[8, ...r(18,26), 88, 89, ...r(96,105)]},
  {sup:["RAVI KUMAR"], loc:"MCD Primary School, DMS Colony, Shadipur", ps:r(65,68)},
  {sup:["MANOJ KUMAR SINGH"], loc:"Nigam Pratibha Vidyalaya, 28-Block, West Patel Nagar", ps:[...r(71,84), ...r(131,137)]},
  {sup:["SUDHIR PATHEJA"], loc:"Delhi Nagar Nigam Pratibha Vidyalaya, Baljeet Nagar", ps:[...r(44,56), 69, 70]},
  {sup:["SUNIL KUMAR"], loc:"G.B.S.S.S. West Patel Nagar", ps:[85, 86, 87, ...r(90,95), 106]},
  {sup:["VIRENDRA KUMAR"], loc:"Govt. Sarvodaya Bal Vidyalaya, West Patel Nagar", ps:[120, 124, 125, ...r(138,143)]},
  {sup:["RAMAN KUMAR"], loc:"MCD Pry School, S-Block, West Patel Nagar", ps:[...r(57,64), ...r(107,110)]},
  {sup:["PANKAJ"], loc:"SKV West Patel Nagar", ps:[111, 112, 114, 116, 117, 127]},
  {sup:["YOGESH SINGH"], loc:"GGSSS West Patel Nagar", ps:[113, 115, 118, 119, 121, 122, 123, 126]},
  {sup:["DR. RAKESH GAUD", "YOGESH SINGH"], loc:"PGDAV SSS West Patel Nagar", ps:[128, 129, 130]},
  {sup:["ADARSH GUPTA"], loc:"Nigam Pratibha Vidyalaya Co-Ed, Opp. Block-15, East Patel Nagar", ps:[145, 146, 148, 149, 150]},
  {sup:["MOHD ASHARAF"], loc:"Nigam Pratibha Vidyalaya, Prasad Nagar", ps:[144, 147, 151, 152]},
  {sup:["MOHD ASHARAF"], loc:"SKV Ranjit Nagar", ps:[...r(153,161), 164, 167, 168]},
  {sup:["RAKESH KUMAR"], loc:"MC Pry School, Z-Block, New Ranjit Nagar", ps:[162, 163, 165, 166]},
  {sup:["KUNJ BIHARI GAUTAM"], loc:"Nigam Pratibha Vidyalaya, Shadi Khampur", ps:r(169,173)},
  {sup:["TAMANNA TANDAN"], loc:"Sarvodaya Bal Vidyalaya, Shadi Khampur", ps:r(174,179)},
  {sup:["GARIMA"], loc:"SKV Shadi Khampur", ps:r(182,189)},
  {sup:["GARIMA"], loc:"Nigam Pratibha Vidyalaya, Old Ranjeet Nagar, Block 8", ps:[180, 181, 190]},
  {sup:["RAJEEV KUMAR"], loc:"MC Primary School, Than Singh Nagar-II, Anand Parvat", ps:[32, 33, 34, ...r(36,43)]},
  {sup:["RAMABIRAJ MEENA"], loc:"Ramjas Primary School, Anand Parvat", ps:[...r(27,31), 35]},
];

// BLO name by Part/PS number (Annexure-C). Index 0 unused.
const BLO = ["",
"KHUSHBOO","KALLU RAM MEENA","SARDAR SINGH MEENA","RAJENDRA KUMAR MEENA","BHISHAM YADAV","ROHIT","MAHESH","AMANDEEP KAUR","VINOD KUMAR MEENA","USHA RAUCHHIYA",
"KALPANA SINGH","PRITOSH KUMAR","JITENDRA KUMAR DUHARIYA","AARTI","OM PRAKASH MEENA","JASWANT SINGH","AMIT SHOKEEN","PRADEEP KUMAR MEENA","SUMER SINGH MEENA","NAVEEN PRATAP SINGH",
"SACHIN KUMAR","KALU RAM MEENA","MALKESH MEENA","BHARTI","LALCHAND","MEENAKSHI MEENA","SAPNA MANCHANDA","RITA KUMARI","SUMAN TANWER","BHAGIRATH SINGH RAJAWAT",
"POOJA GUPTA","RAJEEV SINGH","KRISHNA","RAMESH KUMAR PANNU","FARIDA","MAHENDAR KUMAR BUNKER","PUSHPA","SUNIL","RAJVIR SINGH","RAKESH KUMAR",
"KAMAL JIT","MADHU SIROHI","SIDDHI VASISHTHA","JITENDRA KUMAR MEENA","JYOTI","VIKAS","AKUL KUMAR BHATT","SANJAY KUMAR","MANJU DEVI","SUNIL KUMAR",
"MANOJ KUMAR CHAURASIA","HUKAM SINGH MEENA","JUHI","KAMAL KISHOR MEENA","RAJESH YADAV","MANOJ KUMAR MEENA","ASHWANI","SAVITA","RAM KRISHAN CHAURASIYA","SARITA DEVI",
"PINKI","PRASHANT CHAUDHARY","AMIT PANDEY","SURENDRA SONTHWAL","ANJALI","YASHPAL GAHNOLIYA","MANINDER PAL SINGH","SURESH CHAND","NEERAJ","ANJALI CHAURASIA",
"HITENDER DUTT GAUTAM","MAHENDRA JAKHAR","DEEPCHANDRA","SANJIV SHARMA","VIKAS MEHRA","AMAN KUMAR","LEELA BHATT","CHIRAG","ANIL KUMAR","CHANDAN KUMAR SINGH",
"AARTI","KULDEEP SHARMA","MADHU BALA","DHARMENDER YADAV","LAXMI KANT","KAMAL KANT","NEHA","USHA RANI","RAJENDRA PRASAD","SATYA NARAYAN",
"DHARMNATH CHAUDHARY","ABHISHEK KUMAR","MAUSAM DEVI","DEV VRAT ARYA","KISHOR NATH JHA","USHA BIRMHAN","RAVINDER","SHRIPAL","DEEPAK KUMAR MEENA","PRADEEP KUMAR",
"KULDEEP MEENA","SUSHIL","RAMHET LAL MEENA","MUKESH KUMAR YADAV","VISHNU","JAGDISH KUMAR","SWATI MISHRA","SAPNA RANI MEENA","KAVITA GARG","GEETA NEGI",
"NOOR MOHMAD","NISHI VASHISHT","ANUBHUTI","MONICA","KANIKA NAGPAL ARORA","TAJENDER SINGH","JASVINDER KAUR","SHILPA TYAGI","SUNITA","ANJU SINGH",
"MANMEET KAUR","HEMRAJ","AARTI BAWEJA","ANIL KUMAR SINGH","GURWINDER SINGH","MANISHA GUPTA","ANUBHA OBEROI","PUNEETA SEHGAL","KAMLESH BODWAL","SAROJ KUMARI",
"NARESH KUMAR BUNKAR","AJAI KUMAR","MAHESH KUMAR","KHUSHI RAM MEENA","PANKAJ KUMAR","ANITA KUMARI","SURAJ PRASAD","MAMTA","MUKUL KUMAR","KARAN RATAWAL",
"SHAKUNTLA","SUNIL KUMAR","ANIL KUMAR BHATI","ASHISH TIWARI","ROSHAN KUMAR","SURAJ PRAKASH","MRATYUNJAY SINGH","MANMOHAN KAUR","NIKITA","KAVITA SRIVASTAVA",
"NEERU RANI","SHEKINA PRIYA MARPU","SHIKHA RANI MEHRA","BRAHM DUTT","DEEPESH","DR. SHARWAN KUMAR MEGHWAL","ARVIND KUMAR","RAJU SINGH","ANJU TRIPATHI","SEEMA RANI",
"HUKAMCHAND","RUSAVA CHAITANYA ROUT","SANGEETA LAKRA","SWAPAN MALA","MD NIYAZ ALAM","SUNITA JALUTHARIYA","HARPREET KAUR","SULEKHA","SAROJ DEVI UPADHYAYA","ASHA DEVI",
"SUNITA SINGH CHAUHAN","PUSHPENDER","ANNU","INDER SINGH","ANUP SINGH","NEHA SHARMA","RACHNA BUSSI","PRABHJOT KAUR","NAVRINDER SINGH","OMWATI",
"MADHO LAL MEENA","DAVINDERJIT KAUR","ANUBHA","SANGITA SHARMA","INDERJEET","MAMTA RANI","ROSHAN LAL","MEENU GUPTA","URMILA","ANKIT YADAV"
];

/* ============ APP ============ */
const $ = id => document.getElementById(id);
const supSel = $('supervisor'), rowsEl = $('rows'), listEl = $('list'), phEl = $('placeholder');
const submitBtn = $('submitBtn'), summaryEl = $('summary'), msgEl = $('msg');
const photos = new Map();  // ps -> {data (base64), mimeType, preview}
let current = [];          // [{ps, loc}]

// supervisors in Annexure-A order
const supervisors = [];
LOCATIONS.forEach(l => l.sup.forEach(s => { if (!supervisors.includes(s)) supervisors.push(s); }));
supervisors.forEach(s => {
  const n = LOCATIONS.filter(l => l.sup.includes(s)).reduce((t, l) => t + l.ps.length, 0);
  const o = document.createElement('option');
  o.value = s; o.textContent = `${s}  (${n} PS)`;
  supSel.appendChild(o);
});

// default camp date
$('campDate').value = '2026-09-27';   // special camp date as per order

function showMsg(type, html){ msgEl.className = `msg show ${type}`; msgEl.innerHTML = html; }
function hideMsg(){ msgEl.className = 'msg'; }

supSel.addEventListener('change', () => { hideMsg(); render(supSel.value); });

function render(sup){
  photos.clear(); rowsEl.innerHTML = ''; current = [];
  if (!sup){ listEl.style.display = 'none'; phEl.style.display = ''; updateSummary(); return; }
  listEl.style.display = ''; phEl.style.display = 'none';

  LOCATIONS.filter(l => l.sup.includes(sup)).forEach(l => {
    const h = document.createElement('div');
    h.className = 'loc';
    h.innerHTML = `${esc(l.loc)}${l.sup.length > 1 ? `<span>Shared: ${l.sup.map(esc).join(' / ')}</span>` : ''}`;
    rowsEl.appendChild(h);
    [...l.ps].sort((a,b)=>a-b).forEach(ps => { current.push({ps, loc:l.loc}); rowsEl.appendChild(rowEl(ps)); });
  });
  $('count').textContent = `${current.length} polling station${current.length>1?'s':''}`;
  updateSummary();
}

function rowEl(ps){
  const d = document.createElement('div');
  d.className = 'row'; d.id = `row-${ps}`;
  d.innerHTML = `
    <div class="ps"><small>PS</small>${ps}</div>
    <div class="blo">${esc(BLO[ps] || '—')}<small>BLO, Part ${ps}</small></div>
    <div class="seg" role="radiogroup" aria-label="Status for PS ${ps}">
      <label><input type="radio" name="st-${ps}" value="PRESENT"><span class="p">PRESENT</span></label>
      <label><input type="radio" name="st-${ps}" value="ABSENT"><span class="a">ABSENT</span></label>
    </div>
    <div class="photo">
      <label class="pick" id="pick-${ps}">📷 <span>Upload photo</span>
        <input type="file" accept="image/*" id="file-${ps}">
      </label>
      <img id="thumb-${ps}" alt="" hidden>
      <button type="button" class="x" id="rm-${ps}" title="Remove photo" hidden>×</button>
    </div>`;
  d.querySelectorAll('input[type=radio]').forEach(i => i.addEventListener('change', () => {
    d.classList.remove('missing','is-present','is-absent');
    d.classList.add(i.value === 'PRESENT' ? 'is-present' : 'is-absent');
    updateSummary();
  }));
  d.querySelector(`#file-${ps}`).addEventListener('change', e => onPhoto(ps, e.target));
  d.querySelector(`#rm-${ps}`).addEventListener('click', () => clearPhoto(ps));
  return d;
}

async function onPhoto(ps, input){
  const file = input.files && input.files[0];
  if (!file) return;
  const pick = $(`pick-${ps}`);
  pick.querySelector('span').textContent = 'Processing…';
  try {
    const dataUrl = await compress(file);
    photos.set(ps, { data: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    const t = $(`thumb-${ps}`); t.src = dataUrl; t.hidden = false;
    $(`rm-${ps}`).hidden = false;
    pick.classList.add('has'); pick.querySelector('span').textContent = 'Change';
    $(`row-${ps}`).classList.remove('missing');
  } catch (err) {
    pick.querySelector('span').textContent = 'Upload photo';
    alert('Could not read this image. Please try another photo.');
  }
  input.value = '';
  updateSummary();
}

function clearPhoto(ps){
  photos.delete(ps);
  const t = $(`thumb-${ps}`); t.hidden = true; t.removeAttribute('src');
  $(`rm-${ps}`).hidden = true;
  const pick = $(`pick-${ps}`); pick.classList.remove('has'); pick.querySelector('span').textContent = 'Upload photo';
  updateSummary();
}

function compress(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', JPEG_QUALITY));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

function statusOf(ps){ const c = document.querySelector(`input[name="st-${ps}"]:checked`); return c ? c.value : ''; }

function updateSummary(){
  if (!current.length){ summaryEl.textContent = 'No supervisor selected'; submitBtn.disabled = true; return; }
  let p = 0, a = 0;
  current.forEach(({ps}) => { const s = statusOf(ps); if (s === 'PRESENT') p++; else if (s === 'ABSENT') a++; });
  const left = current.length - p - a;
  summaryEl.innerHTML = `<b>${p}</b> present · <b>${a}</b> absent · <b>${photos.size}</b> photos` + (left ? ` · ${left} left` : '');
  submitBtn.disabled = false;
}

$('allPresent').addEventListener('click', () => {
  current.forEach(({ps}) => { const i = document.querySelector(`input[name="st-${ps}"][value="PRESENT"]`); i.checked = true; i.dispatchEvent(new Event('change')); });
});
$('clearAll').addEventListener('click', () => { if (confirm('Clear all selections and photos?')) render(supSel.value); });

submitBtn.addEventListener('click', async () => {
  hideMsg();
  if (!SCRIPT_URL || SCRIPT_URL.startsWith('PASTE_')) { showMsg('err', 'Setup incomplete: the Apps Script URL has not been added to this page.'); return; }
  const date = $('campDate').value;
  if (!date) { showMsg('err', 'Please choose the camp date.'); return; }

  let firstBad = null;
  current.forEach(({ps}) => {
    const bad = !statusOf(ps) || (PHOTO_REQUIRED && !photos.has(ps));
    $(`row-${ps}`).classList.toggle('missing', bad);
    if (bad && !firstBad) firstBad = ps;
  });
  if (firstBad) {
    showMsg('err', PHOTO_REQUIRED ? 'Please mark Present/Absent and upload a photo for every highlighted PS.' : 'Please mark Present or Absent for every highlighted PS.');
    $(`row-${firstBad}`).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const payload = {
    supervisor: supSel.value,
    campDate: date,
    entries: current.map(({ps, loc}) => ({
      ps, location: loc, bloName: BLO[ps] || '', status: statusOf(ps),
      photo: photos.get(ps) || null
    }))
  };

  submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
  showMsg('info', `Uploading ${payload.entries.length} entries${photos.size ? ` and ${photos.size} photo(s)` : ''}. Please keep this page open…`);
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight with Apps Script
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Server error');
    showMsg('ok', `✅ Submitted for <b>${esc(payload.supervisor)}</b> — ${out.saved} PS saved (${out.updated} updated, ${out.added} new).`);
    supSel.value = ''; render('');
    window.scrollTo({top:0, behavior:'smooth'});
  } catch (err) {
    showMsg('err', `Submission failed: ${esc(err.message)}. Check your internet and try again — nothing is lost on this page.`);
  } finally {
    submitBtn.textContent = 'Submit'; updateSummary();
  }
});

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
